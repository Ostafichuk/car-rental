name: CI/CD Build Pipeline

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './car-rental/package-lock.json'

      - name: Install dependencies & Build frontend
        working-directory: ./car-rental
        run: |
          npm ci
          npm run build
